name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "iOS CFBundleShortVersionString (e.g., 1.0.1)"
        required: false
      build_number:
        description: "iOS CFBundleVersion (numeric)"
        required: false

jobs:
  build-and-upload-testflight:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate required secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8"
          test -n "$IOS_BUNDLE_ID"
          test -n "$IOS_DEVELOPMENT_TEAM"
          test -n "$IOS_SIGNING_CERTIFICATE_P12_BASE64"
          test -n "$IOS_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"

      - name: Configure Runner bundle identifier and code signing
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          # Replace bundle identifier
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.example\.travelSuperApp;/PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID};/g" "$PBXPROJ"
          # Set development team on all build configurations
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
          # Add DEVELOPMENT_TEAM after each CODE_SIGN_STYLE = Manual; line using Python for reliable multi-line edit
          python3 - <<'PYEOF'
import os, re
path = "ios/Runner.xcodeproj/project.pbxproj"
team = os.environ["IOS_DEVELOPMENT_TEAM"]
with open(path, "r") as f:
    content = f.read()
# Insert DEVELOPMENT_TEAM after CODE_SIGN_STYLE = Manual; if not already present
content = re.sub(
    r'(CODE_SIGN_STYLE = Manual;)(\s*)(?!DEVELOPMENT_TEAM)',
    lambda m: m.group(1) + m.group(2) + '\t\t\t\tDEVELOPMENT_TEAM = ' + team + ';\n',
    content
)
with open(path, "w") as f:
    f.write(content)
PYEOF
          # Patch ExportOptionsAppStore.plist with real teamID and bundle ID
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${IOS_DEVELOPMENT_TEAM}/g" ios/ExportOptionsAppStore.plist
          sed -i '' "s/BUNDLE_ID_PLACEHOLDER/${IOS_BUNDLE_ID}/g" ios/ExportOptionsAppStore.plist

      - name: Import iOS signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/Runner.mobileprovision"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH" || \
            echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

      - name: Create placeholder .env for Flutter asset bundle
        run: touch .env

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS IPA
        env:
          BUILD_NAME: ${{ github.event.inputs.build_name }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_ARGS=""
          if [ -n "${BUILD_NAME:-}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-name=$BUILD_NAME"
          fi
          if [ -n "${BUILD_NUMBER:-}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=$BUILD_NUMBER"
          else
            BUILD_ARGS="$BUILD_ARGS --build-number=${GITHUB_RUN_NUMBER}"
          fi
          flutter build ipa --release --export-options-plist=ios/ExportOptionsAppStore.plist $BUILD_ARGS

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf "%s" "$APP_STORE_CONNECT_API_KEY_P8" > "private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Upload build to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
