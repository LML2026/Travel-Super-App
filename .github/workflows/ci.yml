name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:

jobs:
  architecture-and-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check architecture structure
        run: node tools/check-architecture.mjs

      - name: OpenAPI contract guard
        run: node tools/check-openapi-contracts.mjs

      - name: API spec coverage guard
        run: node tools/check-api-spec-coverage.mjs

      - name: Automation workflow parity guard
        run: node tools/check-automation-workflow-parity.mjs

      - name: Backend contract tests
        working-directory: backend
        run: npm run test:contracts

      - name: Backend smoke syntax check
        working-directory: backend
        run: node --check server.js

  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create CI .env placeholder
        run: |
          if [ ! -f .env ]; then
            printf "# CI placeholder env file\n" > .env
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Determine changed Dart files
        id: changed_dart
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.action }}" == "synchronize" && -n "${{ github.event.before }}" ]]; then
              BASE_SHA="${{ github.event.before }}"
            else
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          echo "BASE_SHA=$BASE_SHA"
          echo "HEAD_SHA=${{ github.sha }}"

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="HEAD^"
          fi

          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD \
            | grep '\.dart$' \
            > changed_dart_files.txt || true

          COUNT=$(wc -l < changed_dart_files.txt | xargs)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Dart format check (changed files only)
        run: |
          if [ "${{ steps.changed_dart.outputs.count }}" = "0" ]; then
            echo "No Dart file changes to format-check."
            exit 0
          fi

          mapfile -t DART_FILES < changed_dart_files.txt

          printf 'Checking format for %s Dart files\n' "${#DART_FILES[@]}"
          dart format --set-exit-if-changed "${DART_FILES[@]}"

      - name: Flutter analyze (changed files only)
        run: |
          if [ "${{ steps.changed_dart.outputs.count }}" = "0" ]; then
            echo "No Dart file changes to analyze."
            exit 0
          fi

          mapfile -t DART_FILES < changed_dart_files.txt

          printf 'Analyzing %s Dart files\n' "${#DART_FILES[@]}"
          flutter analyze "${DART_FILES[@]}"

      - name: Flutter tests
        run: |
          if [ "${{ steps.changed_dart.outputs.count }}" = "0" ]; then
            echo "No Dart file changes to test."
            exit 0
          fi

          flutter test
