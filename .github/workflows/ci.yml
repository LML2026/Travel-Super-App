name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:

jobs:
  firestore-security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Firestore rules security tests
        working-directory: functions
        run: npm run test:firestore-rules

  architecture-and-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check architecture structure
        run: node tools/check-architecture.mjs

      - name: OpenAPI contract guard
        run: node tools/check-openapi-contracts.mjs

      - name: API spec coverage guard
        run: node tools/check-api-spec-coverage.mjs

      - name: Automation workflow parity guard
        run: node tools/check-automation-workflow-parity.mjs

      - name: Backend contract tests
        working-directory: backend
        run: npm run test:contracts

      - name: Backend smoke syntax check
        working-directory: backend
        run: node --check server.js

  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Create placeholder .env for asset bundle
        run: touch .env

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter auth tests
        run: flutter test test/features/auth test/features/authentication -r compact

      - name: Flutter trips tests
        run: flutter test test/features/trips -r compact
