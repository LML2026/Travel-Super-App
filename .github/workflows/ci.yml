name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:

jobs:
  architecture-and-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check architecture structure
        run: node tools/check-architecture.mjs

      - name: Backend smoke syntax check
        working-directory: backend
        run: node --check server.js

  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create CI .env placeholder
        run: |
          if [ ! -f .env ]; then
            printf "# CI placeholder env file\n" > .env
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Determine changed Dart files
        id: changed_dart
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.action }}" = "synchronize" ]; then
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              git fetch --no-tags origin "$HEAD_SHA" --depth=2
              RANGE="$HEAD_SHA^..$HEAD_SHA"
            else
              RANGE="${{ github.event.pull_request.base.sha }}...HEAD"
            fi
          else
            RANGE="${{ github.event.before }}...HEAD"
          fi

          if ! git rev-parse "$RANGE" >/dev/null 2>&1; then
            RANGE="HEAD^..HEAD"
          fi

          git diff --diff-filter=ACMR --name-only "$RANGE" -- '*.dart' > changed_dart_files.txt
          COUNT=$(wc -l < changed_dart_files.txt | xargs)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Dart format check (changed files only)
        run: |
          if [ "${{ steps.changed_dart.outputs.count }}" = "0" ]; then
            echo "No Dart file changes to format-check."
            exit 0
          fi

          mapfile -t DART_FILES < changed_dart_files.txt

          printf 'Checking format for %s Dart files\n' "${#DART_FILES[@]}"
          dart format --set-exit-if-changed "${DART_FILES[@]}"

      - name: Flutter analyze (changed files only)
        run: |
          if [ "${{ steps.changed_dart.outputs.count }}" = "0" ]; then
            echo "No Dart file changes to analyze."
            exit 0
          fi

          mapfile -t DART_FILES < changed_dart_files.txt

          printf 'Analyzing %s Dart files\n' "${#DART_FILES[@]}"
          flutter analyze "${DART_FILES[@]}"

      - name: Flutter tests
        run: |
          if [ "${{ steps.changed_dart.outputs.count }}" = "0" ]; then
            echo "No Dart file changes to test."
            exit 0
          fi

          flutter test
