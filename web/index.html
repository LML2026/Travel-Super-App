  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">

<script>
  window.itarevoLoadGoogleMaps = function(apiKey) {
    if (window.google?.maps) return Promise.resolve(true);
    if (!apiKey) return Promise.resolve(false);

    if (!window.itarevoGoogleMapsPromise) {
      window.itarevoGoogleMapsPromise = new Promise((resolve) => {
        const script = document.createElement('script');
        const source = new URL(
          'https://maps.googleapis.com/maps/api/js'
        );

        source.searchParams.set('key', apiKey);
        source.searchParams.set('libraries', 'places');
        script.src = source.toString();
        script.async = true;
        script.onload = () => resolve(true);
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    }

    return window.itarevoGoogleMapsPromise;
  };
</script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
<script>
  window.itarevoPickPlace = async function () {
    const { PlaceAutocompleteElement } =
        await google.maps.importLibrary('places');

    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.inset = '0';
      overlay.style.background = 'rgba(0,0,0,0.45)';
      overlay.style.zIndex = '999999';
      overlay.style.display = 'flex';
      overlay.style.alignItems = 'flex-start';
      overlay.style.justifyContent = 'center';
      overlay.style.paddingTop = '80px';

      const card = document.createElement('div');
      card.style.width = 'min(620px, 92vw)';
      card.style.background = 'white';
      card.style.borderRadius = '18px';
      card.style.padding = '22px';
      card.style.boxShadow = '0 16px 50px rgba(0,0,0,0.25)';

      const header = document.createElement('div');
      header.style.display = 'flex';
      header.style.alignItems = 'center';
      header.style.justifyContent = 'space-between';
      header.style.marginBottom = '18px';

      const title = document.createElement('strong');
      title.textContent = 'Search location';
      title.style.fontSize = '20px';

      const cancel = document.createElement('button');
      cancel.textContent = 'Cancel';
      cancel.style.border = '0';
      cancel.style.background = 'transparent';
      cancel.style.cursor = 'pointer';
      cancel.style.fontSize = '15px';

      header.appendChild(title);
      header.appendChild(cancel);

      const autocomplete = new PlaceAutocompleteElement();
      autocomplete.placeholder =
          'Search places, hotels, restaurants, airports...';
      autocomplete.style.width = '100%';

      card.appendChild(header);
      card.appendChild(autocomplete);
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      const finish = (value) => {
        overlay.remove();
        resolve(value);
      };

      cancel.onclick = () => finish('');

      overlay.addEventListener('click', (event) => {
        if (event.target === overlay) finish('');
      });

      autocomplete.addEventListener(
        
        (event) => {
          console.error('ITAREVO Places autocomplete error', event);

          const errorBox = document.createElement('div');
          errorBox.style.marginTop = '12px';
          errorBox.style.padding = '10px';
          errorBox.style.borderRadius = '8px';
          errorBox.style.background = '#fdecea';
          errorBox.style.color = '#b3261e';
          errorBox.textContent =
              'Google Places search was rejected. Check the browser console for details.';

          card.appendChild(errorBox);
        }
      );

      autocomplete.addEventListener(
        'gmp-select',
        async ({ placePrediction }) => {
          try {
            const place = placePrediction.toPlace();

            await place.fetchFields({
              fields: [
                'displayName',
                'formattedAddress',
                'location'
              ]
            });

            if (!place.location) {
              finish('');
              return;
            }

            finish(JSON.stringify({
              name: place.displayName || '',
              address:
                  place.formattedAddress ||
                  place.displayName ||
                  '',
              latitude: place.location.lat(),
              longitude: place.location.lng()
            }));
          } catch (error) {
            console.error('ITAREVO place selection error', error);
            finish('');
          }
        }
      );

      setTimeout(() => {
        const input = autocomplete.querySelector('input');
        if (input) input.focus();
      }, 200);
    });
  };
</script>
<script>
  window.itarevoNearbySearch = async function(lat, lng, placeType) {
    try {
      const { Place, SearchNearbyRankPreference } =
          await google.maps.importLibrary('places');

      const request = {
        fields: [
          'id',
          'displayName',
          'formattedAddress',
          'location',
          'googleMapsURI'
        ],
        locationRestriction: {
          center: {
            lat: Number(lat),
            lng: Number(lng)
          },
          radius: 3000
        },
        includedPrimaryTypes: [placeType],
        maxResultCount: 12,
        rankPreference: SearchNearbyRankPreference.DISTANCE
      };

      const { places } = await Place.searchNearby(request);

      return JSON.stringify(
        places
          .filter(place => place.location)
          .map(place => ({
            id: place.id || '',
            name: place.displayName || '',
            address: place.formattedAddress || '',
            latitude: place.location.lat(),
            longitude: place.location.lng(),
            googleMapsUrl: place.googleMapsURI || ''
          }))
      );
    } catch (error) {
      console.error('ITAREVO Nearby Search error', error);
      return '[]';
    }
  };
</script>
<script>
  window.itarevoCalculateRoute = async function(
      originLat, originLng, destinationLat, destinationLng, travelMode) {
    console.debug('ITAREVO route request started');

    try {
      const { Route } = await google.maps.importLibrary('routes');
      const response = await Route.computeRoutes({
        origin: {
          lat: Number(originLat),
          lng: Number(originLng)
        },
        destination: {
          lat: Number(destinationLat),
          lng: Number(destinationLng)
        },
        travelMode: travelMode,
        polylineQuality: 'OVERVIEW',
        fields: ['durationMillis', 'distanceMeters', 'path']
      });
      const route = response.routes?.[0];

      if (!route || route.durationMillis == null ||
          route.distanceMeters == null) {
        console.debug('ITAREVO route result null');
        return '';
      }

      const routePoints = route.path || [];
      console.debug('ITAREVO route request completed');

      return JSON.stringify({
        durationMinutes: Math.max(
          1,
          Math.round(route.durationMillis / 60000)
        ),
        distanceMetres: Math.round(route.distanceMeters),
        points: routePoints.map((point) => ({
          latitude: typeof point.lat === 'function'
              ? point.lat()
              : point.lat,
          longitude: typeof point.lng === 'function'
              ? point.lng()
              : point.lng
        }))
      });
    } catch (error) {
      const diagnostic = error?.code || error?.name || 'unknown';
      console.warn('ITAREVO route request failed:', diagnostic);
      return '';
    }
  };
</script>
</body>
</html>
